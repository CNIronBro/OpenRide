spring:
  application:
    name: DiDi

  datasource:
    url: jdbc:mysql://localhost:3309/didi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      # password: 若有密码则取消注释并填写

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    # 开启发布确认，保证消息不丢失
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 手动 ACK，消费失败可 NACK 重入队列或进死信
        acknowledge-mode: manual

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除字段（本项目暂不使用，预留）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 管理员账号（写死，仅用于后台登录，不存数据库）
admin:
  username: admin
  password: admin123

# xxl-job 执行器配置
# 注意：xxl-job-admin 调度中心需单独部署，默认端口 8090（避免与本应用 8080 冲突）
# 调度中心部署方式：下载 xxl-job 源码，修改 xxl-job-admin 的 server.port=8090 后启动
xxl:
  job:
    admin:
      # 调度中心地址，多个地址用逗号分隔（支持集群）
      addresses: http://127.0.0.1:8090/xxl-job-admin
    executor:
      # 执行器名称，需与调度中心配置的执行器 AppName 完全一致
      appname: didi-executor
      # 执行器监听端口，调度中心通过此端口回调触发任务（与 Spring Boot 8080 端口独立）
      port: 9999
      # 任务执行日志路径（Windows 环境改为相对路径）
      logpath: logs/xxl-job
      logretentiondays: 30
    # 鉴权 token，需与调度中心 xxl.job.accessToken 配置保持一致
    accessToken: default_token