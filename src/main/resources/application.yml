spring:
  application:
    name: DiDi

  datasource:
    url: jdbc:mysql://localhost:3309/didi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      # password: 若有密码则取消注释并填写

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    # 开启发布确认，保证消息不丢失
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 手动 ACK，消费失败可 NACK 重入队列或进死信
        acknowledge-mode: manual

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除字段（本项目暂不使用，预留）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 管理员账号（写死，仅用于后台登录，不存数据库）
admin:
  username: admin
  password: admin123

# xxl-job 执行器配置（阶段 8 接入，此处预留）
xxl:
  job:
    admin:
      addresses: http://127.0.0.1:8080/xxl-job-admin
    executor:
      appname: didi-executor
      port: 9999
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30
    accessToken: default_token